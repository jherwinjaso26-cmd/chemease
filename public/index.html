<header><h1>Chem<span>Ease</span> ⚗️</h1><p>Your pocket chemistry helper</p><button id="mu" onclick="tgl()" aria-label="Toggle sound" style="position:absolute;right:16px;top:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:16px;cursor:pointer">🔊</button><button id="vo" onclick="tgv()" aria-label="Toggle voice" style="position:absolute;right:68px;top:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:16px;cursor:pointer">🗣️</button></header>
<nav id="nav"></nav>
<main>
<section id="pt"><div class="card"><p class="hint">Swipe sideways to see the whole table →</p><div class="pt"><div class="grid" id="grid"></div></div><div class="leg" id="leg"></div></div><div class="card" id="info">Tap an element to see its details.</div></section>
<section id="mm"><div class="card"><label>Chemical formula</label><input id="f" value="Ca(OH)2" autocapitalize="off" spellcheck="false"><button class="go" onclick="molar()">Calculate</button><div class="out" id="mo"></div><p style="color:var(--mu);font-size:13px">Supports parentheses and hydrates, e.g. Al2(SO4)3 or CuSO4·5H2O. Case matters (Co ≠ CO).</p></div></section>
<section id="bal"><div class="card"><label>Unbalanced equation</label><input id="eq" value="Fe + O2 -> Fe2O3" autocapitalize="off" spellcheck="false"><button class="go" onclick="balance()">Balance</button><div class="out" id="bo"></div><p style="color:var(--mu);font-size:13px">Use -> or = between sides and + between compounds.</p></div></section>
<section id="gm"><div class="card" id="gbox"></div></section>
<section id="nt"><div class="card" id="pre"></div><div class="card"><b>My notes</b> <span style="color:var(--mu);font-size:13px">(saved on this device)</span><textarea id="my" rows="7" placeholder="Type your own study notes here…" oninput="saveN()"></textarea></div></section>
</main><footer id="dv"></footer><button id="sb" aria-label="Scroll" onclick="sbc()">↓</button>
<script>
const D="H 1.008 Hydrogen|He 4.0026 Helium|Li 6.94 Lithium|Be 9.0122 Beryllium|B 10.81 Boron|C 12.011 Carbon|N 14.007 Nitrogen|O 15.999 Oxygen|F 18.998 Fluorine|Ne 20.18 Neon|Na 22.99 Sodium|Mg 24.305 Magnesium|Al 26.982 Aluminium|Si 28.085 Silicon|P 30.974 Phosphorus|S 32.06 Sulfur|Cl 35.45 Chlorine|Ar 39.948 Argon|K 39.098 Potassium|Ca 40.078 Calcium|Sc 44.956 Scandium|Ti 47.867 Titanium|V 50.942 Vanadium|Cr 51.996 Chromium|Mn 54.938 Manganese|Fe 55.845 Iron|Co 58.933 Cobalt|Ni 58.693 Nickel|Cu 63.546 Copper|Zn 65.38 Zinc|Ga 69.723 Gallium|Ge 72.63 Germanium|As 74.922 Arsenic|Se 78.971 Selenium|Br 79.904 Bromine|Kr 83.798 Krypton|Rb 85.468 Rubidium|Sr 87.62 Strontium|Y 88.906 Yttrium|Zr 91.224 Zirconium|Nb 92.906 Niobium|Mo 95.95 Molybdenum|Tc 98 Technetium|Ru 101.07 Ruthenium|Rh 102.91 Rhodium|Pd 106.42 Palladium|Ag 107.87 Silver|Cd 112.41 Cadmium|In 114.82 Indium|Sn 118.71 Tin|Sb 121.76 Antimony|Te 127.6 Tellurium|I 126.9 Iodine|Xe 131.29 Xenon|Cs 132.91 Caesium|Ba 137.33 Barium|La 138.91 Lanthanum|Ce 140.12 Cerium|Pr 140.91 Praseodymium|Nd 144.24 Neodymium|Pm 145 Promethium|Sm 150.36 Samarium|Eu 151.96 Europium|Gd 157.25 Gadolinium|Tb 158.93 Terbium|Dy 162.5 Dysprosium|Ho 164.93 Holmium|Er 167.26 Erbium|Tm 168.93 Thulium|Yb 173.05 Ytterbium|Lu 174.97 Lutetium|Hf 178.49 Hafnium|Ta 180.95 Tantalum|W 183.84 Tungsten|Re 186.21 Rhenium|Os 190.23 Osmium|Ir 192.22 Iridium|Pt 195.08 Platinum|Au 196.97 Gold|Hg 200.59 Mercury|Tl 204.38 Thallium|Pb 207.2 Lead|Bi 208.98 Bismuth|Po 209 Polonium|At 210 Astatine|Rn 222 Radon|Fr 223 Francium|Ra 226 Radium|Ac 227 Actinium|Th 232.04 Thorium|Pa 231.04 Protactinium|U 238.03 Uranium|Np 237 Neptunium|Pu 244 Plutonium|Am 243 Americium|Cm 247 Curium|Bk 247 Berkelium|Cf 251 Californium|Es 252 Einsteinium|Fm 257 Fermium|Md 258 Mendelevium|No 259 Nobelium|Lr 266 Lawrencium|Rf 267 Rutherfordium|Db 268 Dubnium|Sg 269 Seaborgium|Bh 270 Bohrium|Hs 277 Hassium|Mt 278 Meitnerium|Ds 281 Darmstadtium|Rg 282 Roentgenium|Cn 285 Copernicium|Nh 286 Nihonium|Fl 289 Flerovium|Mc 290 Moscovium|Lv 293 Livermorium|Ts 294 Tennessine|Og 294 Oganesson".split("|").map((s,i)=>{const p=s.split(" ");return{z:i+1,s:p[0],m:+p[1],n:p[2]}});
const M={};D.forEach(e=>M[e.s]=e.m);
const CAT=["Alkali metal","Alkaline earth","Transition metal","Post-transition metal","Metalloid","Nonmetal","Halogen","Noble gas","Lanthanide / Actinide"];
function cat(z){if([3,11,19,37,55,87].includes(z))return 0;if([4,12,20,38,56,88].includes(z))return 1;if([2,10,18,36,54,86,118].includes(z))return 7;if([9,17,35,53,85,117].includes(z))return 6;if([5,14,32,33,51,52].includes(z))return 4;if([1,6,7,8,15,16,34].includes(z))return 5;if((z>=57&&z<=71)||(z>=89&&z<=103))return 8;if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112))return 2;return 3}
function pos(z){if(z==1)return[1,1];if(z==2)return[1,18];if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];if(z<=12)return[3,z-10];if(z<=18)return[3,z];if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];if(z<=56)return[6,z-54];if(z<=71)return[8,z-54];if(z<=86)return[6,z-68];if(z<=88)return[7,z-86];if(z<=103)return[9,z-86];return[7,z-100]}
const g=document.getElementById("grid");
D.forEach(e=>{const[r,c]=pos(e.z),b=document.createElement("button");b.className="el k"+cat(e.z);b.style.animationDelay=e.z*7+"ms";b.style.gridRow=r>7?r+1:r;b.style.gridColumn=c;b.innerHTML="<span>"+e.z+"</span><b>"+e.s+"</b>";b.onclick=()=>{document.getElementById("info").innerHTML="<span class='big'>"+e.s+"</span> — <b>"+e.n+"</b><br>Atomic number: "+e.z+" · Atomic mass: "+e.m+" g/mol<br>Group: "+CAT[cat(e.z)];beep(260+e.z*5,.15,"sine",0,.1);say(e.n+". Atomic number "+e.z+". Atomic mass "+e.m+". "+CAT[cat(e.z)]);document.getElementById("info").scrollIntoView({behavior:"smooth",block:"nearest"})};g.appendChild(b)});
document.getElementById("leg").innerHTML=CAT.map((c,i)=>"<span><i class='k"+i+"'></i>"+c+"</span>").join("");
function parse(f){let i=0;const num=()=>{let s="";while(i<f.length&&/\d/.test(f[i]))s+=f[i++];return s?+s:1};
function grp(){const c={};const add=(g,n)=>{for(const k in g)c[k]=(c[k]||0)+g[k]*n};
while(i<f.length){const ch=f[i];if(ch=="("||ch=="["){i++;const g=grp();if(f[i]!=")"&&f[i]!="]")throw Error("Missing closing bracket");i++;add(g,num())}
else if(ch==")"||ch=="]")return c;
else if(/[A-Z]/.test(ch)){let s=ch;i++;while(i<f.length&&/[a-z]/.test(f[i]))s+=f[i++];if(!M[s])throw Error("Unknown element: "+s);add({[s]:1},num())}
else if(ch=="·"||ch=="*"||ch=="."){i++;const n=num();add(grp(),n);return c}
else throw Error("Unexpected character: "+ch)}return c}
const r=grp();if(i<f.length)throw Error("Unbalanced brackets");return r}
function mass(c){return Object.keys(c).reduce((a,k)=>a+M[k]*c[k],0)}
function molar(){const o=document.getElementById("mo");try{const f=document.getElementById("f").value.replace(/\s/g,"");if(!f)throw Error("Enter a formula");const c=parse(f),t=mass(c);
o.innerHTML="<span class='big'>"+t.toFixed(3)+" g/mol</span><br>"+Object.keys(c).map(k=>k+" × "+c[k]+" = "+(M[k]*c[k]).toFixed(3)+" ("+(M[k]*c[k]/t*100).toFixed(1)+"%)").join("<br>")}catch(e){o.innerHTML="<span class='err'>"+e.message+"</span>"}}
function balance(){const o=document.getElementById("bo");try{const s=document.getElementById("eq").value.replace(/\s/g,"").replace(/→|=>|==|=/g,"->").split("->");if(s.length!=2)throw Error("Use -> between reactants and products");
const L=s[0].split("+").filter(Boolean),R=s[1].split("+").filter(Boolean),all=[...L,...R],cs=all.map(parse),els=[...new Set(cs.flatMap(c=>Object.keys(c)))];
const A=els.map(e=>cs.map((c,j)=>(c[e]||0)*(j<L.length?1:-1))),n=all.length;let r=0;const piv=[];
for(let c=0;c<n&&r<A.length;c++){let p=r;for(let k=r;k<A.length;k++)if(Math.abs(A[k][c])>Math.abs(A[p][c]))p=k;if(Math.abs(A[p][c])<1e-9)continue;[A[r],A[p]]=[A[p],A[r]];const d=A[r][c];A[r]=A[r].map(v=>v/d);for(let k=0;k<A.length;k++)if(k!=r){const f=A[k][c];A[k]=A[k].map((v,j)=>v-f*A[r][j])}piv.push(c);r++}
const free=[...Array(n).keys()].filter(c=>!piv.includes(c));if(free.length!=1)throw Error(free.length?"This equation has multiple possible balances or is invalid":"Can't be balanced — check the formulas");
const v=Array(n).fill(0);v[free[0]]=1;piv.forEach((c,i)=>v[c]=-A[i][free[0]]);
let m=1;for(;m<=1000;m++)if(v.every(x=>Math.abs(x*m-Math.round(x*m))<1e-6))break;const w=v.map(x=>Math.round(x*m));if(w.some(x=>x<=0))throw Error("Can't be balanced — check the formulas");
const f=(a,off)=>a.map((x,j)=>(w[j+off]>1?w[j+off]:"")+x).join(" + ");
o.innerHTML="<span class='big'>"+f(L,0)+" → "+f(R,L.length)+"</span>"}catch(e){o.innerHTML="<span class='err'>"+e.message+"</span>"}}
const Q=[["What is the atomic number of Carbon?",["4","6","8","12"],1],["Which element has the symbol Na?",["Nitrogen","Neon","Sodium","Nickel"],2],["What is the molar mass of H₂O (approx.)?",["16 g/mol","18 g/mol","20 g/mol","34 g/mol"],1],["Which group contains the noble gases?",["Group 1","Group 17","Group 18","Group 2"],2],["pH below 7 means the solution is…",["Basic","Neutral","Acidic","Saturated"],2],["How many moles are in 36 g of water?",["1 mol","2 mol","3 mol","4 mol"],1],["Avogadro’s number is approximately…",["6.02 × 10²³","6.02 × 10²⁰","3.00 × 10⁸","9.81"],0],["Which type of bond shares electrons?",["Ionic","Covalent","Hydrogen","Metallic"],1],["Which element is a halogen?",["Argon","Sodium","Chlorine","Calcium"],2],["In the reaction 2H₂ + O₂ → 2H₂O, what is the coefficient of H₂O?",["1","2","3","4"],1],["What is the charge of a proton?",["Negative","Neutral","Positive","Variable"],2],["Which element has the symbol Fe?",["Fluorine","Iron","Francium","Fermium"],1]];
let qi=0,sc=0,qs=[];
